<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="720" height="405" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="360" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">DNS resolution of www.example.com</text><rect x="30" y="170" width="120" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="90.0" y="194.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Your PC</text><text x="90.0" y="210.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">(browser)</text><rect x="230" y="170" width="130" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="295.0" y="194.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Recursive</text><text x="295.0" y="210.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">resolver</text><rect x="500" y="50" width="170" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="585.0" y="79.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Root server  .</text><rect x="500" y="170" width="170" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="585.0" y="194.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">TLD server</text><text x="585.0" y="210.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">.com</text><rect x="500" y="300" width="170" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="585.0" y="324.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Authoritative</text><text x="585.0" y="340.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">example.com</text><line x1="150" y1="190" x2="230" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="190" y="180" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a">1</text><line x1="230" y1="210" x2="150" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="190" y="226" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a">8</text><line x1="330" y1="170" x2="500" y2="85" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="395" y="104" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">2  ask root</text><line x1="500" y1="98" x2="360" y2="176" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="508" y="138" font-size="11" text-anchor="start" font-weight="normal" fill="#0f172a">3  refer to .com</text><line x1="360" y1="195" x2="500" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="430" y="188" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">4  query</text><line x1="500" y1="212" x2="360" y2="212" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="430" y="230" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">5  ask example.com</text><line x1="330" y1="226" x2="500" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="395" y="305" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">6  query</text><line x1="500" y1="338" x2="360" y2="226" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="445" y="352" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">7  IP address</text><text x="360" y="385" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">8: the resolver gives your PC the final answer (and caches it). Solid = question, dashed = reply.</text>