<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="720" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="360" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Ethernet frame</text><rect x="30" y="36" width="80" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/><text x="70.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Preamble</text><text x="70.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">8 B</text><rect x="110" y="36" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="165.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Dest MAC</text><text x="165.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">6 B</text><rect x="220" y="36" width="110" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="275.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Src MAC</text><text x="275.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">6 B</text><rect x="330" y="36" width="60" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="360.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Type</text><text x="360.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">2 B</text><rect x="390" y="36" width="230" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="505.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Payload (IP packet)</text><text x="505.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">46-1500 B</text><rect x="620" y="36" width="70" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="655.0" y="62.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">FCS</text><text x="655.0" y="98" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">4 B</text><text x="360" y="135" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">A switch learns which MAC address lives on which port</text><rect x="30" y="160" width="215" height="92" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="40" y="180" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">MAC address table (CAM)</text><text x="40" y="200" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">AA:..:01  -&gt;  port 1</text><text x="40" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">AA:..:02  -&gt;  port 2</text><text x="40" y="236" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">AA:..:03  -&gt;  port 3</text><rect x="290" y="175" width="140" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="360.0" y="205.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Switch</text><line x1="360" y1="225" x2="110" y2="300" stroke="#334155" stroke-width="2"/><rect x="60" y="300" width="100" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.0" y="318.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">PC A</text><text x="110.0" y="333.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">AA:..:01</text><line x1="360" y1="225" x2="290" y2="300" stroke="#334155" stroke-width="2"/><rect x="240" y="300" width="100" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="290.0" y="318.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">PC B</text><text x="290.0" y="333.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">AA:..:02</text><line x1="360" y1="225" x2="470" y2="300" stroke="#334155" stroke-width="2"/><rect x="420" y="300" width="100" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="470.0" y="318.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">PC C</text><text x="470.0" y="333.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">AA:..:03</text><line x1="360" y1="225" x2="640" y2="300" stroke="#334155" stroke-width="2"/><rect x="590" y="300" width="100" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="640.0" y="318.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">PC D</text><text x="640.0" y="333.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">AA:..:04</text><text x="360" y="372" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">Frame from A to C: the switch looks up C's MAC and forwards it out port 3 only</text></svg>