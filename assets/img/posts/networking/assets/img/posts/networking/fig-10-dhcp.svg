<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="720" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="360" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">DHCP: DORA</text><rect x="100" y="40" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="160.0" y="61.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">New client</text><rect x="500" y="40" width="120" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="560.0" y="61.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">DHCP server</text><line x1="160" y1="74" x2="160" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><line x1="560" y1="74" x2="560" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><line x1="160" y1="100" x2="560" y2="126" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="94" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">D  Discover</text><text x="360" y="146" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">"Is there a DHCP server?" (broadcast)</text><line x1="560" y1="180" x2="160" y2="206" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="174" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">O  Offer</text><text x="360" y="226" font-size="12" text-anchor="middle" font-weight="normal" fill="#475569">"Take 192.168.1.50 / 24, gateway .1, DNS .1"</text><line x1="160" y1="260" x2="560" y2="286" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="254" font-size="14" text-anchor="middle" font-weight="bold" fil