1="130" x2="638" y2="130" stroke="#334155" stroke-width="2"/><rect x="638" y="118" width="44" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="660.0" y="133.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#0f172a">PC-B</text><text x="660" y="165" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">192.168.2.10</text><rect x="90" y="230" width="250" height="70" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="215.0" y="254.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">R1 routing table</text><text x="215.0" y="269.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">192.168.1.0/24  connected</text><text x="215.0" y="284.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">192.168.2.0/24  via 10.0.0.2</text><rect x="390" y="230" width="250" height="70" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="515.0" y="254.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">R2 routing table</text><text x="515.0" y="269.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">192.168.2.0/24  connected</text><text x="515.0" y="284.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">192.168.1.0/24  via 10.0.0.1</text><text x="360" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#475569">Each router needs a route to the network behind the other router.</text></svg>